<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Page Not Found | M4ST</title>
  <meta name="description" content="This page doesn't exist. Return to M4ST — Anuj's autonomous AI agent systems portfolio.">
  <meta name="robots" content="noindex, nofollow">
  <link rel="canonical" href="https://m4st.vercel.app/">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='16' fill='%2307090e'/><text y='.9em' font-size='80' x='10' fill='%2300ff9d' font-family='monospace' font-weight='bold'>M</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;700&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #07090e;
      --surface: #0d1117;
      --green: #00ff9d;
      --green-dim: rgba(0,255,157,0.08);
      --text: #e2e8f0;
      --muted: #64748b;
      --border: rgba(0,255,157,0.15);
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .glow { position: fixed; border-radius: 50%; filter: blur(120px); pointer-events: none; z-index: 0; }
    .glow-1 { width: 400px; height: 400px; background: rgba(0,255,157,0.04); top: -100px; right: -100px; }
    .glow-2 { width: 300px; height: 300px; background: rgba(0,180,255,0.03); bottom: -80px; left: -80px; }
    .container {
      position: relative; z-index: 1;
      text-align: center;
      padding: 2rem;
      max-width: 600px;
    }
    .code {
      font-family: 'Fira Code', monospace;
      font-size: clamp(5rem, 20vw, 9rem);
      font-weight: 700;
      color: var(--green);
      line-height: 1;
      letter-spacing: -0.04em;
      text-shadow: 0 0 40px rgba(0,255,157,0.3);
      animation: pulse 3s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100%{ opacity:1; } 50%{ opacity:0.7; } }
    .label {
      font-family: 'Fira Code', monospace;
      font-size: 0.75rem;
      color: var(--muted);
      letter-spacing: 0.2em;
      text-transform: uppercase;
      margin: 0.75rem 0 1.5rem;
    }
    .message {
      font-size: 1.1rem;
      color: var(--muted);
      line-height: 1.6;
      margin-bottom: 2.5rem;
    }
    .message span { color: var(--text); font-weight: 600; }
    .btn {
      display: inline-flex; align-items: center; gap: 0.5rem;
      background: var(--green-dim);
      color: var(--green);
      border: 1px solid var(--border);
      padding: 0.75rem 1.75rem;
      border-radius: 8px;
      font-family: 'Fira Code', monospace;
      font-size: 0.9rem;
      font-weight: 500;
      text-decoration: none;
      transition: all 0.2s ease;
    }
    .btn:hover {
      background: rgba(0,255,157,0.12);
      border-color: rgba(0,255,157,0.4);
      transform: translateY(-1px);
      box-shadow: 0 4px 20px rgba(0,255,157,0.15);
    }
    .breadcrumb {
      margin-top: 3rem;
      font-family: 'Fira Code', monospace;
      font-size: 0.72rem;
      color: var(--muted);
    }
    .breadcrumb span { color: var(--green); }
  </style>
</head>
<body>
  <div class="glow glow-1"></div>
  <div class="glow glow-2"></div>
  <div class="container">
    <div class="code">404</div>
    <div class="label">// signal_lost</div>
    <p class="message">
      This page doesn't exist in the <span>M4ST</span> system.<br>
      Maybe the node was moved or decommissioned.
    </p>
    <a href="/" class="btn">
      ← Return to Base
    </a>
    <div class="breadcrumb">
      m4st.vercel.app / <span>404</span>
    </div>
  </div>
</body>
</html>
