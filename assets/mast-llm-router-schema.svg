<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#faf9f6"/>
      <stop offset="100%" stop-color="#f3efe8"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" rx="16" fill="url(#bgGrad3)"/>
  <rect x="24" y="24" width="752" height="402" rx="12" fill="none" stroke="#e2ddd5" stroke-width="1.5" stroke-dasharray="4 4"/>
  
  <text x="48" y="64" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#9a8d7c" letter-spacing="0.1em">HIGH-THROUGHPUT INFERENCE GATEWAY</text>
  <text x="48" y="92" font-family="'Newsreader', Georgia, serif" font-size="24" font-weight="600" fill="#1c1917">mast-llm-router Semantic Dispatch Pipeline</text>
  
  <!-- Flow Diagram -->
  <g transform="translate(48, 140)">
    <!-- Client In -->
    <rect x="0" y="60" width="130" height="70" rx="8" fill="#ffffff" stroke="#e7e2d9" stroke-width="1.5"/>
    <text x="65" y="92" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#1c1917">Client / Agent</text>
    <text x="65" y="108" font-family="sans-serif" font-size="10" text-anchor="middle" fill="#78716c">Inference Call</text>
    
    <!-- Router Hub -->
    <rect x="180" y="30" width="170" height="130" rx="10" fill="#ffffff" stroke="#c2410c" stroke-width="2"/>
    <text x="265" y="62" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#c2410c">mast-llm-router</text>
    <text x="265" y="82" font-family="sans-serif" font-size="10" text-anchor="middle" fill="#57534e">Semantic Token Filter</text>
    <text x="265" y="100" font-family="sans-serif" font-size="10" text-anchor="middle" fill="#57534e">Rate-Limit Balancer</text>
    <text x="265" y="118" font-family="sans-serif" font-size="10" text-anchor="middle" fill="#57534e">Zero-VRAM Cloud Tier</text>
    <text x="265" y="142" font-family="monospace" font-size="10" font-weight="600" text-anchor="middle" fill="#16a34a">Latency: &lt;4ms</text>
    
    <!-- Route Targets -->
    <g transform="translate(400, 0)">
      <rect x="0" y="0" width="304" height="42" rx="6" fill="#ffffff" stroke="#e7e2d9" stroke-width="1.5"/>
      <text x="16" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#1c1917">Google DeepMind Runtime</text>
      <text x="288" y="26" font-family="monospace" font-size="11" text-anchor="end" fill="#c2410c">Tier 1 (Pro / Flash)</text>
      
      <rect x="0" y="54" width="304" height="42" rx="6" fill="#ffffff" stroke="#e7e2d9" stroke-width="1.5"/>
      <text x="16" y="80" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#1c1917">NVIDIA NIM Cloud Gateway</text>
      <text x="288" y="80" font-family="monospace" font-size="11" text-anchor="end" fill="#c2410c">83 Models (DeepSeek R1)</text>
      
      <rect x="0" y="108" width="304" height="42" rx="6" fill="#ffffff" stroke="#e7e2d9" stroke-width="1.5"/>
      <text x="16" y="134" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#1c1917">Oracle OCI ARM Cluster</text>
      <text x="288" y="134" font-family="monospace" font-size="11" text-anchor="end" fill="#16a34a">OpenClaw + 9Router</text>
      
      <rect x="0" y="162" width="304" height="42" rx="6" fill="#ffffff" stroke="#e7e2d9" stroke-width="1.5"/>
      <text x="16" y="188" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#1c1917">GCP Telemetry Sink</text>
      <text x="288" y="188" font-family="monospace" font-size="11" text-anchor="end" fill="#78716c">strange-mariner-464613</text>
    </g>
    
    <!-- Arrows -->
    <path d="M 130 95 L 180 95" stroke="#c2410c" stroke-width="1.5"/>
    <path d="M 350 70 L 400 21" stroke="#c2410c" stroke-width="1.5"/>
    <path d="M 350 85 L 400 75" stroke="#c2410c" stroke-width="1.5"/>
    <path d="M 350 105 L 400 129" stroke="#c2410c" stroke-width="1.5"/>
